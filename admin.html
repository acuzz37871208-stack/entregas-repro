<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app" id="login-box">
<h2>Ingresar</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Contraseña">
<button id="login">Entrar</button>
<p id="login-error" style="color:#f66"></p>
</div>

<div class="app" id="panel" style="display:none">
<button id="logout" class="ghost" style="float:right">Salir</button>
<h1>Panel Admin</h1>

<h2>Pedidos pendientes</h2>
<div id="pedidos"></div>

<h2>Registrar entrega</h2>
<select id="re-paciente"></select>
<select id="re-genetica"></select>
<input id="re-gramos" type="number" inputmode="decimal" step="any" placeholder="Gramos">
<button id="re-guardar">Guardar</button>

<h2>Nuevo paciente</h2>
<input id="np-nombre" placeholder="Nombre">
<input id="np-pin" inputmode="numeric" maxlength="4" placeholder="Clave de 4 dígitos">
<button id="np-crear">Crear paciente</button>

<h2>Mantenimiento</h2>
<button id="migrar" class="ghost">Migrar entregas antiguas</button>
<p id="info"></p>
</div>

<script type="module" src="./admin.js"></script>
</body>
</html>
