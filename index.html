<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consumo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main class="app">

<section id="login" class="login">
<p class="eyebrow">Seguimiento mensual</p>
<h1>Consumo</h1>
<label for="pin">Ingresá tu clave de 4 dígitos</label>
<input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
<p id="login-error" class="error" role="alert"></p>
</section>

<section id="app" hidden>
<header class="top">
<div>
<p class="eyebrow">Seguimiento mensual</p>
<h1>Consumo</h1>
</div>
<button id="salir" class="usuario" type="button"></button>
</header>

<section class="resumen">
<div>
<span class="label">Disponible este mes</span>
<div class="big" id="disponible"></div>
<p id="detalle"></p>
</div>
</section>

<section class="pedir">
<h2>Pedir genéticas</h2>
<div id="opciones" class="opciones"></div>
<input id="gramos" type="number" inputmode="decimal" min="0" step="any" placeholder="Gramos">
<button id="pedir" type="button" disabled>Pedir</button>
<p id="msg" class="msg" role="status"></p>
</section>

<section class="historial">
<h2>Historial</h2>
<div id="lista"></div>
</section>
</section>

</main>

<script type="module" src="./app.js"></script>
</body>
</html>
